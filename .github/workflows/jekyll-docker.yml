name: Node.js & PostgreSQL CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sae_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Load PostgreSQL schema and seed data
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sae_pos
        run: |
          node -e "
            const fs = require('fs');
            const { Pool } = require('pg');
            (async () => {
              const pool = new Pool({ connectionString: process.env.DATABASE_URL });
              await pool.query(fs.readFileSync('schema.sql', 'utf8'));
              await pool.query(fs.readFileSync('seed.sql', 'utf8'));
              await pool.end();
              console.log('Schema and seed loaded successfully');
            })().catch(err => { console.error(err); process.exit(1); });
          "

      - name: Syntax check backend scripts
        run: npm run check

      - name: Verify ledger & DB sync
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sae_pos
        run: node api_sync.js --db

