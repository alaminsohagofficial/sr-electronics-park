<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR ELECTRONICS PARK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #05080f; margin: 0; overflow: hidden; font-family: sans-serif; }
        #canvas-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
        .ui-layer { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; box-sizing: border-box; }
        .glow-card { box-shadow: 0 0 25px rgba(0, 240, 255, 0.25); border: 1px solid rgba(0, 240, 255, 0.4); }
    </style>
</head>
<body class="text-white">

    <div id="canvas-bg"></div>

    <div class="ui-layer max-w-md mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center bg-[#0d131f]/90 border border-cyan-500/30 p-3 rounded-2xl backdrop-blur-md">
            <div>
                <h1 class="text-base font-black text-cyan-400 tracking-wider">SR ELECTRONICS PARK</h1>
                <p class="text-[9px] text-gray-400 uppercase">Showroom Product 3D Showcase</p>
            </div>
            <button onclick="alert('যোগাযোগ: হাটবোয়ালিয়া বাজার, চুয়াডাঙ্গা')" class="border border-cyan-400 text-cyan-400 text-xs px-3 py-1 rounded-full font-bold">
                হেল্প
            </button>
        </div>

        <!-- Product Card -->
        <div class="bg-[#0c121d]/90 rounded-3xl p-5 glow-card backdrop-blur-lg my-auto">
            <span id="pTag" class="text-[9px] bg-cyan-950 text-cyan-300 border border-cyan-500/40 px-2 py-0.5 rounded font-bold uppercase">
                BUTTERFLY FACTORY
            </span>
            <h2 id="pTitle" class="text-xl font-black mt-2 text-white">LG Smart Refrigerator</h2>
            <div id="pPrice" class="text-2xl font-black text-cyan-400 my-1">৳ ৭৮,৫০০</div>
            <p id="pDesc" class="text-xs text-gray-300 leading-relaxed mb-4">
                বাটারফ্লাই ফ্যাক্টরিতে অ্যাসেম্বলকৃত অরিজিনাল ইনভার্টার ফ্রিজ। ১০ বছরের ওয়ারেন্টি।
            </p>
            <button onclick="orderViaWA()" class="w-full bg-transparent hover:bg-cyan-400 hover:text-black border-2 border-cyan-400 text-cyan-400 py-2.5 rounded-xl font-extrabold text-sm transition-all">
                বুকিং দিন
            </button>
        </div>

        <!-- Category Tabs -->
        <div class="bg-[#0d131f]/90 border border-cyan-500/30 p-2 rounded-2xl backdrop-blur-md grid grid-cols-2 gap-2">
            <button onclick="changeProduct(0)" id="b0" class="bg-cyan-400 text-black text-xs font-bold py-2 rounded-xl">LG Refrigerator</button>
            <button onclick="changeProduct(1)" id="b1" class="border border-gray-700 text-gray-400 text-xs font-semibold py-2 rounded-xl">ECO+ Smart TV</button>
            <button onclick="changeProduct(2)" id="b2" class="border border-gray-700 text-gray-400 text-xs font-semibold py-2 rounded-xl">Minister Direct Cool</button>
            <button onclick="changeProduct(3)" id="b3" class="border border-gray-700 text-gray-400 text-xs font-semibold py-2 rounded-xl">Samsung Galaxy</button>
        </div>
    </div>

    <script>
        const prods = [
            { tag: "BUTTERFLY FACTORY", title: "LG Smart Refrigerator", price: "৳ ৭৮,৫০০", desc: "বাটারফ্লাই ফ্যাক্টরিতে অ্যাসেম্বলকৃত অরিজিনাল ইনভার্টার ফ্রিজ। ১০ বছরের কম্প্রেসার ওয়ারেন্টি ও স্মার্ট ডোর কুলিং।" },
            { tag: "OFFICIAL BUTTERFLY", title: "ECO+ 43\" 4K Smart TV", price: "৳ ৩৬,৯০০", desc: "অফিশিয়াল অ্যান্ড্রয়েড ওএস, ভয়েস কন্ট্রোল রিমোট এবং ডলবি ডিজিটাল অডিও।" },
            { tag: "MINISTER HI-TECH", title: "Minister Ultra Inverter Fridge", price: "৳ ৪৪,৫০০", desc: "মিনিস্টার হাই-টেক পার্কের পাওয়ার সেভিং ইনভার্টার টেকনোলজি ও দ্রুত বরফ জমার সুবিধা।" },
            { tag: "FLAGSHIP SMARTPHONE", title: "Samsung Galaxy S24 Ultra", price: "৳ ১,৪৯,০০০", desc: "অফিশিয়াল বিটিআরসি অনুমোদিত স্মার্টফোন, গ্যালাক্সি এআই ও ২০০ মেগাপিক্সেল ক্যামেরা।" }
        ];

        let curr = 0;

        function changeProduct(idx) {
            curr = idx;
            const p = prods[idx];
            document.getElementById('pTag').innerText = p.tag;
            document.getElementById('pTitle').innerText = p.title;
            document.getElementById('pPrice').innerText = p.price;
            document.getElementById('pDesc').innerText = p.desc;

            for(let i=0; i<4; i++) {
                const b = document.getElementById('b' + i);
                if(i === idx) {
                    b.className = "bg-cyan-400 text-black text-xs font-bold py-2 rounded-xl";
                } else {
                    b.className = "border border-gray-700 text-gray-400 text-xs font-semibold py-2 rounded-xl";
                }
            }
        }

        function orderViaWA() {
            const p = prods[curr];
            const msg = `*SR ELECTRONICS PARK ORDER*%0A%0A*পণ্য:* ${p.title}%0A*মূল্য:* ${p.price}`;
            window.open(`https://wa.me/8801700000000?text=${msg}`, '_blank');
        }

        // 3D Perspective Wireframe Grid
        const container = document.getElementById('canvas-bg');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const grid = new THREE.GridHelper(40, 25, 0x00f0ff, 0x112233);
        grid.position.y = -1.5;
        scene.add(grid);

        const boxGeo = new THREE.BoxGeometry(2.5, 3.5, 2);
        const wire = new THREE.WireframeGeometry(boxGeo);
        const box = new THREE.LineSegments(wire, new THREE.LineBasicMaterial({ color: 0x00f0ff }));
        box.position.set(0, 0.5, 0);
        scene.add(box);

        function animate() {
            requestAnimationFrame(animate);
            box.rotation.y += 0.008;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
