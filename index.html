<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR ELECTRONICS PARK - 3D Virtual Showroom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#040711',
                            card: '#0b111e',
                            border: '#1b2a42',
                            cyan: '#00f0ff',
                            cyanDark: '#009ba6',
                            muted: '#8a9fb8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Model Viewer (Free & Open Source 3D/AR Engine) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #040711;
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        model-viewer {
            width: 100%;
            height: 280px;
            background: radial-gradient(circle, rgba(0,240,255,0.08) 0%, rgba(4,7,17,0) 70%);
            border-radius: 1.5rem;
            --poster-color: transparent;
        }
        .glow-box {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between p-3 sm:p-5 selection:bg-cyber-cyan selection:text-black">

    <!-- Top Header -->
    <header class="max-w-md w-full mx-auto flex justify-between items-center bg-cyber-card/90 border border-cyber-border p-3 rounded-2xl backdrop-blur-md">
        <div>
            <h1 class="text-base font-black text-cyber-cyan tracking-wide flex items-center gap-1.5">
                <i class="fa-solid fa-cube text-sm"></i> SR ELECTRONICS PARK
            </h1>
            <p class="text-[9px] text-cyber-muted uppercase tracking-wider">3D Showroom • Butterfly & Minister Partner</p>
        </div>
        <button onclick="alert('শোরুম ঠিকানা: হাটবোয়ালিয়া বাজার, আলমডাঙ্গা, চুয়াডাঙ্গা। প্রোপাইটর: মোঃ আল আমিন সোহাগ')" class="border border-cyber-cyan/60 text-cyber-cyan hover:bg-cyber-cyan hover:text-black text-xs px-3 py-1.5 rounded-xl font-bold transition-all">
            হেল্প
        </button>
    </header>

    <!-- Main 3D Showcase Stage -->
    <main class="max-w-md w-full mx-auto my-auto py-3">
        <div class="bg-cyber-card border border-cyber-cyan/40 rounded-3xl p-4 sm:p-5 glow-box relative">
            
            <!-- 3D Interactive Model Viewer with AR -->
            <div class="relative w-full rounded-2xl overflow-hidden border border-cyber-border/80 bg-black/40">
                <model-viewer 
                    id="product3DViewer"
                    src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/AntiqueCamera/glTF-Binary/AntiqueCamera.glb"
                    poster="https://via.placeholder.com/400x300/0b111e/00f0ff?text=Loading+3D+Model..."
                    alt="3D Electronics Product"
                    auto-rotate
                    camera-controls
                    touch-action="pan-y"
                    shadow-intensity="1.5"
                    exposure="1"
                    ar
                    ar-modes="webxr scene-viewer quick-look">
                    <button slot="ar-button" class="absolute bottom-3 right-3 bg-cyber-cyan text-black px-3 py-1.5 rounded-xl text-[11px] font-black shadow-lg flex items-center gap-1.5">
                        <i class="fa-solid fa-camera"></i> ঘরে দেখুন (AR)
                    </button>
                </model-viewer>
                
                <div class="absolute top-2 left-2 pointer-events-none bg-black/60 px-2 py-0.5 rounded-md text-[9px] text-cyber-cyan font-bold border border-cyber-cyan/30">
                    <i class="fa-solid fa-arrows-rotate"></i> 360° আঙুল দিয়ে ঘুরিয়ে দেখুন
                </div>
            </div>

            <!-- Product Info -->
            <div class="mt-4">
                <div class="flex justify-between items-center mb-1">
                    <span id="prodTag" class="text-[10px] uppercase font-bold text-cyber-cyan bg-cyan-950/80 border border-cyber-cyan/40 px-2 py-0.5 rounded">
                        BUTTERFLY FACTORY
                    </span>
                    <span id="prodBrand" class="text-[11px] font-semibold text-cyber-muted">
                        LG ELECTRONICS
                    </span>
                </div>
                
                <h2 id="prodTitle" class="text-xl font-black text-white mt-1">LG Smart Inverter Refrigerator</h2>
                <div id="prodPrice" class="text-2xl font-black text-cyber-cyan my-1">৳ ৭৮,৫০০</div>
                
                <p id="prodDesc" class="text-xs text-cyber-muted leading-relaxed mb-4">
                    বাটারফ্লাই ফ্যাক্টরিতে অ্যাসেম্বলকৃত অরিজিনাল ইনভার্টার ফ্রিজ। ১০ বছরের কম্প্রেসার ওয়ারেন্টি ও স্মার্ট ডোর কুলিং সিস্টেম।
                </p>

                <!-- Booking Button -->
                <button onclick="orderViaWA()" class="w-full bg-cyber-cyan hover:bg-cyber-cyanDark text-black py-3 rounded-2xl font-black text-sm transition-all shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-base"></i> অর্ডার / বুকিং নিশ্চিত করুন
                </button>
            </div>

        </div>
    </main>

    <!-- Category Tabs -->
    <footer class="max-w-md w-full mx-auto pb-2">
        <div class="bg-cyber-card border border-cyber-border p-2 rounded-2xl grid grid-cols-2 gap-2 shadow-xl">
            <button onclick="changeShowcase(0)" id="t0" class="tab-btn bg-cyber-cyan text-black text-xs font-bold py-2.5 px-2 rounded-xl transition-all text-center truncate">
                LG Refrigerator
            </button>
            <button onclick="changeShowcase(1)" id="t1" class="tab-btn bg-transparent text-cyber-muted hover:text-white border border-cyber-border text-xs font-semibold py-2.5 px-2 rounded-xl transition-all text-center truncate">
                Minister Direct Cool
            </button>
            <button onclick="changeShowcase(2)" id="t2" class="tab-btn bg-transparent text-cyber-muted hover:text-white border border-cyber-border text-xs font-semibold py-2.5 px-2 rounded-xl transition-all text-center truncate">
                ECO+ 4K Smart TV
            </button>
            <button onclick="changeShowcase(3)" id="t3" class="tab-btn bg-transparent text-cyber-muted hover:text-white border border-cyber-border text-xs font-semibold py-2.5 px-2 rounded-xl transition-all text-center truncate">
                LG Dual Inverter AC
            </button>
        </div>
    </footer>

    <!-- Interactive Logic -->
    <script>
        // Catalog with Free 3D Models
        const catalog = [
            {
                tag: "BUTTERFLY FACTORY",
                brand: "LG ELECTRONICS",
                title: "LG Smart Inverter Refrigerator",
                price: "৳ ৭৮,৫০০",
                desc: "বাটারফ্লাই ফ্যাক্টরিতে অ্যাসেম্বলকৃত অরিজিনাল ইনভার্টার ফ্রিজ। ১০ বছরের কম্প্রেসার ওয়ারেন্টি ও স্মার্ট ডোর কুলিং সিস্টেম।",
                modelUrl: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/BoomBox/glTF-Binary/BoomBox.glb"
            },
            {
                tag: "MINISTER HI-TECH",
                brand: "MINISTER GROUP",
                title: "Minister Direct Cool 222L",
                price: "৳ ৩৮,৫০০",
                desc: "মিনিস্টার হাই-টেক পার্কের পাওয়ার সেভিং ইনভার্টার টেকনোলজি ও অ্যান্টি-ব্যাকটেরিয়াল ডোর গ্যাসকেট।",
                modelUrl: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/BoxInterleaved/glTF-Binary/BoxInterleaved.glb"
            },
            {
                tag: "OFFICIAL BUTTERFLY",
                brand: "ECO+ BRAND",
                title: "ECO+ 43\" 4K Smart TV",
                price: "৳ ৩৬,৯০০",
                desc: "অফিশিয়াল অ্যান্ড্রয়েড ওএস, ভয়েস কন্ট্রোল রিমোট, ডলবি অডিও সাউন্ড সিস্টেম এবং ২ বছরের প্যানেল ওয়ারেন্টি।",
                modelUrl: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/AntiqueCamera/glTF-Binary/AntiqueCamera.glb"
            },
            {
                tag: "LG INVERTER",
                brand: "BUTTERFLY FACTORY",
                title: "LG Dual Inverter 1.5 Ton AC",
                price: "৳ ৭২,০০০",
                desc: "৭০% পর্যন্ত বিদ্যুৎ সাশ্রয়ী ডুয়াল কুলিং টেকনোলজি এবং ১০ বছরের কম্প্রেসার ওয়ারেন্টি।",
                modelUrl: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Lantern/glTF-Binary/Lantern.glb"
            }
        ];

        let selectedIndex = 0;

        function changeShowcase(index) {
            selectedIndex = index;
            const p = catalog[index];

            // Update 3D Model
            const viewer = document.getElementById('product3DViewer');
            viewer.src = p.modelUrl;

            // Update Details
            document.getElementById('prodTag').innerText = p.tag;
            document.getElementById('prodBrand').innerText = p.brand;
            document.getElementById('prodTitle').innerText = p.title;
            document.getElementById('prodPrice').innerText = p.price;
            document.getElementById('prodDesc').innerText = p.desc;

            // Highlight Active Tab
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                if(idx === index) {
                    btn.className = "tab-btn bg-cyber-cyan text-black text-xs font-bold py-2.5 px-2 rounded-xl transition-all text-center truncate";
                } else {
                    btn.className = "tab-btn bg-transparent text-cyber-muted hover:text-white border border-cyber-border text-xs font-semibold py-2.5 px-2 rounded-xl transition-all text-center truncate";
                }
            });
        }

        function orderViaWA() {
            const p = catalog[selectedIndex];
            const msg = `*SR ELECTRONICS PARK ORDER*%0A%0A*পণ্য:* ${p.title}%0A*মূল্য:* ${p.price}%0A*শোরুম:* হাটবোয়ালিয়া বাজার, চুয়াডাঙ্গা`;
            window.open(`https://wa.me/8801700000000?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
